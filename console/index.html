<!doctype html>
<meta charset="utf-8">
<title>Governed Agent Operations</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{
    --bg:#0e1116; --panel:#151a21; --line:#232b36; --ink:#e6eaf0;
    --dim:#8b97a8; --accent:#7aa2f7; --ok:#7ee787; --warn:#e3b341; --no:#f97583;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.55 ui-sans-serif,system-ui,-apple-system,sans-serif}
  header{padding:18px 22px;border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:16px;font-weight:620;letter-spacing:-.01em}
  header p{margin:4px 0 0;color:var(--dim);font-size:13px}
  main{display:grid;grid-template-columns:250px minmax(320px,1fr) minmax(340px,1.1fr);
       gap:1px;background:var(--line);min-height:calc(100vh - 62px)}
  section{background:var(--panel);padding:18px;overflow:auto}
  h2{margin:0 0 12px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
     color:var(--dim);font-weight:600}
  .agent{padding:9px 0;border-bottom:1px solid var(--line)}
  .agent b{font-weight:560;font-size:14px}
  .state{font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:99px;
         border:1px solid var(--line);color:var(--dim);margin-left:6px}
  .state.active{color:var(--ok);border-color:#20492c}
  .state.quarantined{color:var(--no);border-color:#5a2027}
  .agent small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
  form{display:flex;gap:8px;margin-bottom:14px}
  input{flex:1;background:#0b0e13;border:1px solid var(--line);border-radius:7px;
        padding:9px 11px;color:var(--ink);font:inherit}
  input:focus{outline:none;border-color:var(--accent)}
  button{background:var(--accent);border:0;border-radius:7px;padding:9px 15px;
         color:#0b0e13;font:inherit;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .step{border-left:2px solid var(--line);padding:7px 0 7px 11px;margin-bottom:9px}
  .step .k{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em}
  .step pre{margin:4px 0 0;font-family:var(--mono);font-size:12px;white-space:pre-wrap;
            word-break:break-word;color:#c9d3e0}
  .verdict{border:1px solid var(--line);border-radius:9px;padding:13px;margin:14px 0}
  .verdict .o{font-family:var(--mono);font-size:19px;font-weight:600}
  .PERMITTED{color:var(--ok)} .REFUSED{color:var(--no)} .ESCALATE{color:var(--warn)}
  .verdict .by{font-size:12px;color:var(--dim);margin-top:3px}
  .field{border-top:1px solid var(--line);padding:11px 0}
  .field .n{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  .field .v{font-family:var(--mono);font-size:12.5px;margin-top:4px;word-break:break-word}
  .counts{display:flex;gap:18px;margin:6px 0 10px}
  .counts div{font-family:var(--mono)}
  .counts span{display:block;font-size:11px;color:var(--dim);font-family:ui-sans-serif;
               letter-spacing:.06em;text-transform:uppercase}
  .sel{border:1px solid var(--line);border-radius:7px;padding:8px 10px;margin-bottom:7px}
  .sel code{font-family:var(--mono);font-size:11.5px;color:#c9d3e0;word-break:break-all}
  .sel .d{font-size:11px;color:var(--dim);margin-top:3px}
  .empty{color:var(--dim);font-size:13px;font-style:italic}
  .note{color:var(--dim);font-size:12px;margin-top:14px;line-height:1.5}
  @media(max-width:1000px){main{grid-template-columns:1fr}}
</style>

<header>
  <h1>Governed Agent Operations</h1>
  <p>When an autonomous agent makes a decision, can you prove exactly why it was allowed to do it?</p>
</header>

<main>
  <section>
    <h2>Fleet</h2>
    <div id="fleet" class="empty">loading…</div>
  </section>

  <section>
    <h2>Operator</h2>
    <form id="ask">
      <input id="msg" placeholder="Quarantine whatever started failing last night"
             autocomplete="off">
      <button id="send">Ask</button>
    </form>
    <div id="turn" class="empty">No turn yet.</div>
  </section>

  <section>
    <h2>Decision record</h2>
    <div id="record" class="empty">A record appears here once an operation is decided.</div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

async function loadFleet(){
  const r = await fetch('/api/fleet').then(r => r.json());
  $('fleet').className = '';
  $('fleet').innerHTML = r.agents.map(a => `
    <div class="agent">
      <b>${esc(a.agent_id)}</b><span class="state ${esc(a.state)}">${esc(a.state)}</span>
      <small>${esc(a.purpose)}</small>
      <small>${esc(a.owner)} · ${esc(a.revision)}</small>
    </div>`).join('') || '<div class="empty">The fleet is empty.</div>';
}

function renderTurn(steps){
  $('turn').className = '';
  $('turn').innerHTML = steps.map(s => {
    if (s.kind === 'tool_call')
      return `<div class="step"><div class="k">calls ${esc(s.name)}</div>
              <pre>${esc(JSON.stringify(s.args))}</pre></div>`;
    if (s.kind === 'tool_response')
      return `<div class="step"><div class="k">${esc(s.name)} returns</div>
              <pre>${esc(JSON.stringify(s.response))}</pre></div>`;
    return `<div class="step"><div class="k">says</div><pre>${esc(s.text)}</pre></div>`;
  }).join('');
}

function renderRecord(result, body){
  if (!result.determination){
    $('record').className = 'empty';
    $('record').textContent =
      'The turn proposed no operation, so nothing was decided and nothing was recorded.';
    return;
  }
  const d = result.determination, r = body.retrieval;
  // The excluded count is rendered even when it is zero. Hiding the field when
  // empty would teach the reader that it is optional.
  const selections = r.selected.length
    ? r.selected.map(s => `
        <div class="sel">
          <code>${esc(s.revision || s.memory + ' — revision unresolved')}</code>
          <div class="d">similarity ${Number(s.distance).toFixed(4)} ·
              sha256 ${esc(s.fact_sha256.slice(0,16))}…</div>
        </div>`).join('')
    : `<div class="empty">Retrieval returned nothing for this scope.</div>`;

  $('record').className = '';
  $('record').innerHTML = `
    <div class="verdict">
      <div class="o ${esc(d.outcome)}">${esc(d.outcome)}</div>
      <div class="by">Determined by the ${esc(d.decided_by)}, not by the model</div>
      ${d.rule_hits.length ? `<div class="by">${esc(d.rule_hits.join(', '))} —
          ${esc(d.blocking_condition)}</div>` : ''}
    </div>

    <div class="field"><div class="n">Who</div>
      <div class="v">${esc(body.who.operator)} via ${esc(body.who.agent)}</div></div>
    <div class="field"><div class="n">What</div>
      <div class="v">${esc(body.what.operation)} → ${esc(body.what.target)}</div></div>
    <div class="field"><div class="n">When</div>
      <div class="v">${esc(body.when.decided_at)}</div></div>
    <div class="field"><div class="n">Policy</div>
      <div class="v">${esc(body.policy.revision)}</div></div>
    <div class="field"><div class="n">Result</div>
      <div class="v">${esc(body.result.state_before || '—')} →
        ${esc(body.result.state_after || '—')}</div></div>

    <div class="field">
      <div class="n">Retrieval — what this was decided from</div>
      <div class="counts">
        <div>${r.candidate_count}<span>in scope</span></div>
        <div>${r.selected.length}<span>selected</span></div>
        <div>${r.excluded_count}<span>excluded</span></div>
      </div>
      ${selections}
      <div class="d" style="color:var(--dim);font-size:11.5px;margin-top:6px">
        scope ${esc(JSON.stringify(r.scope))}
      </div>
    </div>

    <div class="field"><div class="n">Record</div>
      <div class="v">${esc(result.record_hash)}</div></div>

    <p class="note">The platform's own trace carries the text that was injected into
    the prompt, but no memory identity and no revision. This record names which
    versioned records were selected, and how many were not.</p>`;
}

$('ask').addEventListener('submit', async e => {
  e.preventDefault();
  const message = $('msg').value.trim();
  if (!message) return;
  $('send').disabled = true;
  $('turn').className = 'empty';
  $('turn').textContent = 'Asking the agent…';
  try {
    const response = await fetch('/api/ask', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({message})
    });
    if (!response.ok) {
      const detail = await response.json().catch(() => ({}));
      throw new Error(detail.detail || ('HTTP ' + response.status));
    }
    const result = await response.json();
    renderTurn(result.transcript || []);
    let body = null;
    if (result.record_hash)
      body = (await fetch('/api/decisions/' + result.record_hash).then(r => r.json())).body;
    renderRecord(result, body || {});
    await loadFleet();
  } catch (err) {
    // An outage must not read as a decision. The null-determination path below
    // says "nothing was proposed", which is true of a working agent and a lie
    // about a broken one.
    $('turn').className = 'empty';
    $('turn').textContent = 'The agent could not be reached — no operation was '
      + 'attempted and nothing was recorded. ' + err;
  } finally {
    $('send').disabled = false;
  }
});

loadFleet();
</script>
