[project]
name = "governed-agent-ops"
version = "0.1.0"
description = "An operations agent for a fleet of agents, whose every action carries a record that binds the retrieval set it decided from."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<0.142",
    "google-auth>=2.56,<3",
    "google-cloud-aiplatform[agent_engines,adk]>=1.164,<2",
    "google-cloud-firestore>=2.28,<3",
    "requests>=2.34,<3",
    "uvicorn>=0.52,<0.53",
]

[project.optional-dependencies]
test = [
    "httpx2>=2.12,<3",
    "pytest>=9.1,<10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
