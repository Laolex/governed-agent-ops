[project]
name = "governed-agent-ops"
version = "0.1.0"
description = "An operations agent for a fleet of agents, whose every action carries a record that binds the retrieval set it decided from."
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
